<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pravesh Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f7f7f5;color:#111}.wrap{max-width:800px;margin:auto;padding:30px 20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin:16px 0}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{background:#111;color:#fff;border:0;border-radius:7px;font-weight:bold}.orange{background:#ff551f}.hide{display:none}.msg{padding:10px;background:#eee;border-radius:7px;margin-top:8px}</style></head><body><div class="wrap"><h1>PRAVESH <span style="color:#ff551f">ADMIN.</span></h1><div id="loginBox" class="card"><h2>Login</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="orange" onclick="login()">LOGIN</button><div id="lm"></div></div><div id="app" class="hide"><div class="card"><h2>Add Project / Reel</h2><input id="title" placeholder="Project title"><input id="cat" placeholder="Category"><input id="video" type="file" accept="video/*"><input id="thumb" type="file" accept="image/*"><input id="order" type="number" value="1"><button class="orange" onclick="addProject()">UPLOAD PROJECT</button><div id="pm"></div></div><div class="card"><h2>Showreel</h2><input id="stitle" value="SHOWREEL"><input id="svideo" type="file" accept="video/*"><input id="sthumb" type="file" accept="image/*"><button class="orange" onclick="addShow()">UPLOAD SHOWREEL</button><div id="sm"></div></div><button onclick="logout()">LOGOUT</button></div></div><script>const db=supabase.createClient("https://neodjgcxzfcduzobgoko.supabase.co","sb_publishable_Zx7bPAu8yWc0C6NtPLjeQQ_T-FyDRTe");const $=id=>document.getElementById(id);function m(id,t){$(id).innerHTML='<div class="msg">'+t+'</div>'}async function login(){let r=await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});if(r.error)m("lm",r.error.message);else show()}async function show(){let{data}=await db.auth.getSession();$("loginBox").classList.toggle("hide",!!data.session);$("app").classList.toggle("hide",!data.session)}async function logout(){await db.auth.signOut();show()}async function up(f,folder){if(!f)return null;let p=folder+"/"+crypto.randomUUID()+"."+f.name.split(".").pop();let r=await db.storage.from("portfolio-media").upload(p,f);if(r.error)throw r.error;return db.storage.from("portfolio-media").getPublicUrl(p).data.publicUrl}async function addProject(){try{m("pm","Uploading…");let v=await up($("video").files[0],"videos"),t=await up($("thumb").files[0],"thumbnails");if(!v)throw Error("Choose a video.");let r=await db.from("projects").insert({title:$("title").value||"Untitled",category:$("cat").value||"VIDEO PROJECT",video_url:v,thumbnail_url:t,sort_order:+$("order").value||1});if(r.error)throw r.error;m("pm","Project uploaded.");}catch(e){m("pm",e.message)}}async function addShow(){try{m("sm","Uploading…");let v=await up($("svideo").files[0],"showreels"),t=await up($("sthumb").files[0],"thumbnails");if(!v)throw Error("Choose a video.");let r=await db.from("showreel").insert({title:$("stitle").value||"SHOWREEL",video_url:v,thumbnail_url:t,sort_order:1});if(r.error)throw r.error;m("sm","Showreel uploaded.");}catch(e){m("sm",e.message)}}show()</script></body></html>
